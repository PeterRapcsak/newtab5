<!DOCTYPE html>
<!--======================================================================
    index.html - A New Tab oldal fő HTML váza
----------------------------------------------------------------------
    FELADAT:
     - A statikus DOM-váz felépítése: keresősáv + részletes keresés,
       Quick Tools ikonok, valutaváltó, Time Tools (Stopwatch/Timer/
       Pomodoro), QR-kód widget, shortcut-ok, alsó eszköztár, page
       controls (téma + Edit gomb)
     - A ténylegesen dinamikus tartalmat (shortcut-ok, alsó eszköztár
       szekciói, téma testreszabó panel, Import/Export és Edit gombok)
       a scripts/*.js fájlok töltik fel / építik fel futásidőben - itt
       csak a "hely" (üres konténer) van nekik lefoglalva
    MEGJEGYZÉS:
     - A HTML nem támogatja a JS/CSS-stílusú szekciófejléceket, ezért
       itt egyszerű, leíró HTML-kommentek jelzik az egyes fő blokkokat,
       illetve hogy melyik scripts/*.js fájl tölti fel/vezérli őket
======================================================================-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Tab</title>

    <!-- Kétféle ikon: a modern böngészők a PNG-t, a régebbiek az .ico-t használják -->
    <link rel="icon" href="favicon/home16.png" type="image/png">
    <link rel="shortcut icon" href="favicon.ico">

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome: innen jön az ÖSSZES ikon (fas fa-* osztályok) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <!-- ==================== FELSŐ SZEKCIÓ ====================
         Két hasáb: balra az eszközök, jobbra a shortcut-ok -->
    <div class="top-section">
        <div class="left-half">
            <!-- Keresősáv (search.js) -->
            <div class="search-bar glass-card">
                <!-- A keresésre az Enter és a gomb is jó (lásd setupSearch) -->
                <input type="text" id="search-q" placeholder="Search the web...">
                <button id="search-btn">Search</button>
                <button type="button" id="advanced-btn" class="icon-btn" title="Advanced search" aria-label="Toggle advanced search">
                    <i class="fas fa-sliders"></i>
                </button>
            </div>

            <!-- Quick Tools: kompakt ikon-triggerek a kis képernyőn elrejtett
                 panelekhez (quickTools.js nyitja meg popoverként) -->
            <div class="quick-tools">
                <button type="button" class="icon-btn quick-tool-btn" id="quick-currency-btn" title="Currency converter" aria-label="Open currency converter">
                    <i class="fas fa-coins"></i>
                </button>
                <button type="button" class="icon-btn quick-tool-btn" id="quick-time-btn" title="Stopwatch & timer" aria-label="Open stopwatch and timer">
                    <i class="fas fa-stopwatch"></i>
                </button>
            </div>

            <!-- Részletes keresés (search.js állítja össze a lekérdezést, quickTools.js nyitja/zárja) -->
            <div id="advanced-search" class="advanced-search glass-card">
                <div class="advanced-grid">
                    <!-- Keresőmotor + dátumszűrés. A value-k a search.js-beli
                         searchEngines id-jeivel, illetve a Google &tbs=qdr:
                         paraméterének értékeivel egyeznek meg -->
                    <div class="advanced-row advanced-engine-row">
                        <select id="search-engine-select" class="compact-select">
                            <option value="google">Google</option>
                            <option value="bing">Bing</option>
                            <option value="duckduckgo">DuckDuckGo</option>
                            <option value="brave">Brave</option>
                            <option value="yandex">Yandex</option>
                            <option value="startpage">Startpage</option>
                            <option value="baidu">Baidu</option>
                        </select>

                        <select id="adv-date-range" class="compact-select">
                            <option value="">Any date</option>
                            <option value="d">Last 24h</option>
                            <option value="w">Last week</option>
                            <option value="m">Last month</option>
                            <option value="y">Last year</option>
                        </select>
                    </div>

                    <!-- Google-stílusú operátorok. Mindegyik mező máshogy
                         épül be a lekérdezésbe: idézőjel, OR, "-" előjel
                         (lásd performSearch a search.js-ben) -->
                    <div class="advanced-group">
                        <input type="text" id="adv-all-words" placeholder="All these words">
                        <input type="text" id="adv-exact-phrase" placeholder="Exact phrase">
                    </div>

                    <div class="advanced-group">
                        <input type="text" id="adv-any-words" placeholder="Any of these words">
                        <input type="text" id="adv-none-words" placeholder="None of these words">
                    </div>

                    <!-- Fájltípus-szűrés: a bepipált value-kból filetype: operátorok lesznek -->
                    <div class="advanced-row">
                        <div class="file-types">
                            <div class="compact-checkboxes">
                                <label><input type="checkbox" value="pdf">PDF</label>
                                <label><input type="checkbox" value="doc">DOC</label>
                                <label><input type="checkbox" value="docx">DOCX</label>
                                <label><input type="checkbox" value="xls">XLS</label>
                                <label><input type="checkbox" value="xlsx">XLSX</label>
                                <label><input type="checkbox" value="ppt">PPT</label>
                                <label><input type="checkbox" value="pptx">PPTX</label>
                                <label><input type="checkbox" value="txt">TXT</label>
                                <label><input type="checkbox" value="html">HTML</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Eszköz-sor -->
            <div class="tools-row">
                <!-- Valutaváltó (currency.js tölti fel a <select>-eket és számol) -->
                <div class="currency-exchanger glass-card">
                    <form class="exchange-form">
                        <!-- A két <select> ÜRESEN indul - a loadCurrencies()
                             tölti fel őket az API-ból kapott listával -->
                        <div class="currency-row">
                            <select id="from-currency"></select>
                            <div class="input-with-spinner">
                                <input type="text" id="amount" inputmode="decimal" placeholder="Amount">
                                <div class="spinner-buttons">
                                    <button type="button" class="spinner-btn spinner-up" data-target="amount">▲</button>
                                    <button type="button" class="spinner-btn spinner-down" data-target="amount">▼</button>
                                </div>
                            </div>
                        </div>
                        <div class="currency-row">
                            <select id="to-currency"></select>
                            <div class="input-with-spinner">
                                <input type="text" id="result" inputmode="decimal" placeholder="Result">
                                <div class="spinner-buttons">
                                    <button type="button" class="spinner-btn spinner-up" data-target="result">▲</button>
                                    <button type="button" class="spinner-btn spinner-down" data-target="result">▼</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Time Tools: Stopper / Visszaszámláló / Pomodoro fülek
                     (timeTools.js vezérli a Stopwatch/Timer-t, pomodoro.js a Pomodoro fület) -->
                <div class="time-tools glass-card">
                    <div class="mode-tabs">
                        <button class="toggle-btn active" data-target="stopwatch">Stopwatch</button>
                        <button class="toggle-btn" data-target="timer">Timer</button>
                        <button class="toggle-btn" data-target="pomodoro">Pomodoro</button>
                    </div>
                    <!-- Egyszerre mindig csak egy panelnek van .active
                         osztálya - a fülváltást a timeTools.js intézi -->
                    <div class="time-tool-content">
                        <div class="stopwatch active">
                            <div class="display">0.00</div>
                        </div>
                        <div class="timer">
                            <div class="display" tabindex="0">
                                <span class="digit hours">00</span><span class="time-segment">:</span><span class="digit minutes">00</span><span class="time-segment">:</span><span class="digit seconds">00</span>
                            </div>
                            <div class="time-progress"><div class="time-progress-fill" id="timer-progress-fill"></div></div>
                        </div>
                        <div class="pomodoro-panel">
                            <div class="display">
                                <span id="pomodoro-time">25:00</span>
                                <div class="pomodoro-header">
                                    <span class="pomodoro-phase" id="pomodoro-phase">FOCUS</span>
                                    <button type="button" class="icon-btn pomodoro-settings-btn" id="pomodoro-settings-btn" title="Pomodoro settings" aria-label="Pomodoro settings">
                                        <i class="fas fa-gear"></i>
                                    </button>
                                </div>
                            </div>
                            <div class="time-progress"><div class="time-progress-fill" id="pomodoro-progress-fill"></div></div>
                        </div>
                    </div>
                    <!-- KÖZÖS vezérlők: mindhárom fül ezt a két gombot használja -->
                    <div class="controls">
                        <button class="start-stop"><i class="fas fa-play"></i><span>Start</span></button>
                        <button class="reset"><i class="fas fa-redo"></i></button>
                    </div>
                </div>
            </div>

            <!-- QR-kód generátor (qrWidget.js + a becsomagolt qrcode-generator.js) -->
            <div class="qr-widget glass-card" id="qr-widget">
                <!-- autocomplete="off": amit ide beírnak (wifi jelszó, privát
                     link), azt a böngésző se jegyezze meg -->
                <input type="text" id="qr-input" class="qr-input" placeholder="Paste text or a URL…" autocomplete="off" spellcheck="false">

                <!-- Alapból hidden - csak akkor jelenik meg, ha van mit mutatni -->
                <div class="qr-output" id="qr-output" hidden></div>
            </div>
        </div>

        <!-- Jobb oldali fél - Shortcut-ok (shortcuts.js) -->
        <div class="right-half">
            <div id="shortcuts-wrapper" class="shortcuts-wrapper">
                <!-- A konténerek ide kerülnek dinamikusan, JS-ből -->
            </div>
            <!-- "Új shortcut" form: rejtve indul, a konténerek "+" gombja nyitja meg -->
            <div class="add-shortcut glass-card" style="display: none;">
                <input type="text" id="new-shortcut-name" placeholder="Name">
                <input type="text" id="new-shortcut-url" placeholder="URL">
                <button id="add-shortcut-btn">Add</button>
            </div>
        </div>
    </div>

    <!-- Alsó szekció - szerkeszthető eszköztár (bottomBar.js) -->
    <div class="bottom-section">
        <!-- A szekciók ide kerülnek dinamikusan, JS-ből -->
    </div>

    <!-- Téma testreszabó (themeCustomizer.js) + az egyetlen, központi Edit
         gomb (main.js), jobb alul -->
    <!-- Szándékosan üres: a téma-fogaskerék, az Edit és az Import/Export
         gombok mind JS-ből kerülnek ide -->
    <div class="page-controls" id="page-controls"></div>

    <!-- type="module" kötelező: a scripts/*.js fájlok ES modulok (import/export) -->
    <script type="module" src="scripts/main.js"></script>
</body>
</html>
